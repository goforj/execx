name: Go Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "stable"

      - name: Verify module files
        run: |
          go mod tidy
          go -C docs mod tidy
          go -C examples mod tidy
          git diff --exit-code -- go.mod go.sum docs/go.mod docs/go.sum examples/go.mod examples/go.sum

      - name: Run tests
        run: |
          go test ./... -v
          go -C docs test ./...
          go -C examples test ./...

      - name: Run tests with coverage
        run: go test -coverprofile=coverage.txt .

      - name: Upload results to Codecov
        uses: codecov/codecov-action@v5
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
