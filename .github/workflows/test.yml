name: Quality

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    name: Go ${{ matrix.go-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.27.x", "stable"]

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Verify module files
        run: |
          go mod tidy
          go -C docs mod tidy
          go -C examples mod tidy
          git diff --exit-code -- go.mod go.sum docs/go.mod docs/go.sum examples/go.mod examples/go.sum

      - name: Run tests
        run: |
          go test ./...
          go -C docs test ./...
          go -C examples test ./...

      - name: Run static analysis
        run: |
          go vet ./...
          go -C docs vet ./...
          go -C examples vet ./...

      - name: Compile platform-specific tests
        run: |
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go test -c -o /tmp/execx-windows.test .
          GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go test -c -o /tmp/execx-darwin.test .
          GOOS=plan9 GOARCH=amd64 CGO_ENABLED=0 go test -c -o /tmp/execx-plan9.test .
          GOOS=js GOARCH=wasm CGO_ENABLED=0 go test -c -o /tmp/execx-js.test .

      - name: Run race detector
        run: go test -race ./...

      - name: Enforce full statement coverage
        run: |
          go test -coverprofile=coverage.txt .
          coverage="$(go tool cover -func=coverage.txt | awk '/^total:/ { print $3 }')"
          test "$coverage" = "100.0%"

      - name: Verify generated documentation
        run: |
          go -C docs run ./examplegen
          go -C docs run ./readme
          git diff --exit-code

      - name: Upload results to Codecov
        if: matrix.go-version == 'stable'
        uses: codecov/codecov-action@04b047e8bb82a0c002c8312c1c880fbc6a999d45 # v5
        with:
          files: coverage.txt
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
